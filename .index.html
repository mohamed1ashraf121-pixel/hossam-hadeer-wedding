<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hossam & Hadeer Wedding</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="invitation" id="invitation">
    <div class="card">

      <p class="subtitle">TOGETHER WITH THEIR FAMILIES</p>

      <div class="ornament">❦</div>

      <h1>Hossam</h1>
      <p class="subtitle">AND</p>
      <h1>Hadeer</h1>

      <div class="ornament">❦</div>

      <p class="rose">♡ ❀ ♡</p>

      <div class="lace">
        <p class="subtitle">REQUEST THE HONOUR OF YOUR PRESENCE</p>
        <div class="details">
          <p>At the celebration of their wedding</p>
          <p>Wedding Date</p>
          <p>Wedding Time</p>
          <p>Wedding Venue</p>
        </div>
      </div>

      <button id="openInvitation">Open Our Invitation ♡</button>

      <div class="details">
        <p>We can't wait to celebrate with you</p>
      </div>

      <button id="musicButton">♫ Play Music</button>

      <audio id="weddingMusic" loop></audio>

      <div id="countdown"></div>

    </div>
  </main>

  <script src="script.js"></script>

</body>
</html>
